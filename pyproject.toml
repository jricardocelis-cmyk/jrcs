[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalalert"
version = "0.1.0"
description = "Alertas en vivo de apuestas con valor en mercados de goles de fútbol"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goalalert = "goalalert.cli:main"

[tool.setuptools.packages.find]
include = ["goalalert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
